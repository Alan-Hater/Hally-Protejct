<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFI // INTERNAL_SERVER_OVERRIDE</title>
    <style>
        body {
            background-color: #020503;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
            text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
        }

        /* Efekt profesjonalnego serwera rządowego */
        .terminal-header {
            border-bottom: 2px dashed #00ff66;
            padding-bottom: 15px;
            margin-bottom: 25px;
            color: #fff;
        }

        .alert-glitch {
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 8px #ff0000;
        }

        #output {
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(0, 255, 102, 0.3);
            padding-top: 15px;
        }

        .prompt {
            font-weight: bold;
            margin-right: 12px;
            white-space: nowrap;
        }

        input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: inherit;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
        }

        .success-text {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="terminal-header">
    [ AFI // AUTONOMOUS FEDERAL INVESTIGATION — SECURE MAINFRAME REPOSITORY ]<br>
    WARNING: UNAUTHORIZED INTRUSION DETECTED IN NODE_FOUR. LOCAL SYSTEM IS COMMANDEERED.
</div>

<div id="output"></div>

<div class="input-line" id="input-container">
    <span class="prompt">root@AFI_SERVER_BYPASS:~#</span>
    <input type="text" id="cmd-field" autocomplete="off" autofocus placeholder="Wpisz /help aby zacząć...">
</div>

<script>
    // Bezpieczny hash SHA-256 dla kodu "D76h4N"
    const TARGET_HASH = "b909062eb868cb8b776f82798f01b34e4439cfa4267ca08a8a30364fe060f64b";
    const LIMIT = 5;

    const introText = [
        ">> POŁĄCZENIE Z SERWEREM AFI USTANOWIONE TRWAŁE.",
        ">> ZABEZPIECZENIA TERMINALA PRZEJĘTE PRZEZ PROTOKÓŁ ZEWNĘTRZNY.",
        "STATUS SERWERA: BLOKADA BAZY DANYCH.",
        "WYMAGANIE SYSTEMU: 6-ZNAKOWY KLUCZ SYSTEMOWY (WIELKOŚĆ LITER MA ZNACZENIE).",
        ">> Użyj komendy /help aby odczytać instrukcje złamania zapory."
    ];

    const outputDiv = document.getElementById("output");
    const inputField = document.getElementById("cmd-field");

    // Wyświetlenie wiadomości powitalnej
    introText.forEach(text => {
        let p = document.createElement("div");
        if (text.includes("STATUS") || text.includes("WYMAGANIE")) {
            p.className = "alert-glitch";
        }
        p.innerText = text;
        outputDiv.appendChild(p);
    });

    // Funkcja do sprawdzania liczby prób
    function checkStatus() {
        let currentAttempts = parseInt(localStorage.getItem('afi_lock_tries')) || 0;
        let lastTime = parseInt(localStorage.getItem('afi_lock_time')) || 0;
        let now = Date.now();

        // Reset po 24 godzinach
        if (now - lastTime > 24 * 60 * 60 * 1000) {
            localStorage.setItem('afi_lock_tries', '0');
            currentAttempts = 0;
        }

        return currentAttempts;
    }

    // Wyświetlenie stanu prób na start
    function showRemaining() {
        let currentAttempts = checkStatus();
        let p = document.createElement("div");
        p.style.color = "rgba(0, 255, 102, 0.5)";
        p.innerText = `[AFI-MATRIX] Pozostałe autoryzacje na ten cykl: ${LIMIT - currentAttempts}/${LIMIT}`;
        outputDiv.appendChild(p);
    }
    showRemaining();

    // Funkcja szyfrująca do SHA-256
    async function getHash(text) {
        const msgBuffer = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Obsługa kliknięcia Enter
    inputField.addEventListener("keydown", async function(e) {
        if (e.key === "Enter") {
            let userText = inputField.value.trim();
            if (!userText) return;

            // Wyświetlenie komendy użytkownika
            let userLine = document.createElement("div");
            userLine.innerHTML = `<span style="color: rgba(0, 255, 102, 0.5);">root@AFI_SERVER_BYPASS:~#</span> ${userText}`;
            outputDiv.appendChild(userLine);

            let resLine = document.createElement("div");

            // Sprawdzenie blokady na samym początku akcji
            let currentAttempts = checkStatus();
            if (LIMIT - currentAttempts <= 0) {
                resLine.className = "alert-glitch";
                resLine.innerText = "[BLOKADA SYSTEMOWA] Przekroczono limit prób. Serwer AFI odciął dostęp na 24 godziny.";
                outputDiv.appendChild(resLine);
                document.getElementById("input-container").style.display = "none";
                inputField.value = "";
                return;
            }

            // PROSTE PRZETWARZANIE KOMEND
            if (userText === "/help") {
                resLine.innerHTML = "DOSTĘPNE PROTOKOŁY WŁAMANIA DO SYGNAŁU:<br>" +
                                    " - <span style='color: #fff;'>/help</span> : Wyświetla listę poleceń hakerskich.<br>" +
                                    " - <span style='color: #fff;'>/haslo [KOD]</span> : Wysyła 6-znakowy token autoryzacyjny (np. <i>/haslo 123456</i>).";
            } 
            else if (userText.startsWith("/haslo ")) {
                // Wyciągamy dokładnie to, co jest po "/haslo "
                let enteredPassword = userText.substring(7).trim();

                if (enteredPassword.length !== 6) {
                    resLine.className = "alert-glitch";
                    resLine.innerText = "[BŁĄD SKŁADNI] Token bezpieczeństwa AFI musi mieć dokładnie 6 znaków.";
                } else {
                    // Rejestrujemy próbę
                    currentAttempts++;
                    localStorage.setItem('afi_lock_tries', currentAttempts.toString());
                    localStorage.setItem('afi_lock_time', Date.now().toString());

                    let encryptedInput = await getHash(enteredPassword);

                    if (encryptedInput === TARGET_HASH) {
                        localStorage.setItem('afi_lock_tries', '0');
                        resLine.className = "success-text";
                        resLine.innerHTML = "ZAPORA AFI ROZBITA. DE-SZYFRACJA ZAKOŃCZONA POWODZENIEM... 100%<br>" +
                                             "Uzyskano dostęp do tajnego kanału informacyjnego:<br>" +
                                             "<a href='https://github.io' style='color:#33ffff; text-decoration:underline;'>URUCHOM MANIFEST KOŃCOWY</a>";
                        document.getElementById("input-container").style.display = "none";
                    } else {
                        resLine.className = "alert-glitch";
                        resLine.innerText = "[ODMOWA DOSTĘPU] Błędna sygnatura klucza szyfrującego.";
                        
                        // Jeśli to była ostatnia próba, chowamy panel wpisywania natychmiast
                        if (LIMIT - currentAttempts <= 0) {
                            document.getElementById("input-container").style.display = "none";
                            setTimeout(() => {
                                outputDiv.innerHTML = "<div class='alert-glitch'>[SYSTEM LOCKDOWN] Włam wykryty. Terminal trwale zablokowany na 24 godziny.</div>";
                            }, 500);
                        }
                    }
                }
            } 
            else {
                resLine.innerText = `Błąd: Komenda '${userText}' nie istnieje na tym węźle AFI. Wpisz /help.`;
            }

            outputDiv.appendChild(resLine);
            inputField.value = "";
            window.scrollTo(0, document.body.scrollHeight);
            
            // Jeśli system nie jest zablokowany, wypisujemy zaktualizowaną liczbę prób
            if (document.getElementById("input-container").style.display !== "none") {
                let statusLine = document.createElement("div");
                statusLine.style.color = "rgba(0, 255, 102, 0.3)";
                statusLine.innerText = `[AFI-MATRIX] Pozostałe autoryzacje: ${LIMIT - currentAttempts}/${LIMIT}`;
                outputDiv.appendChild(statusLine);
            }
        }
    });
</script>

</body>
</html>
