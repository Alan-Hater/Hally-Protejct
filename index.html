<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM CRITICAL OVERRIDE</title>
    <style>
        body {
            background-color: #020202;
            color: #ff3333; /* Czerwony kolor błędu/wirusa */
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .glitch {
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.8; text-shadow: 0 0 5px #ff3333; }
            100% { opacity: 1; text-shadow: 0 0 15px #ff0000, 0 0 20px #ff3333; }
        }
        .hidden-link {
            color: #111; /* Prawie niewidoczny tekst - czarny na czarnym */
            text-decoration: none;
            cursor: default;
        }
        .hidden-link:hover {
            color: #222; /* Nadal ukryty, haker musi sprawdzić kod źródłowy */
        }
        #command-line {
            display: none;
            color: #00ff33; /* Zielony dla konsoli użytkownika */
        }
        input {
            background: transparent;
            border: none;
            color: #00ff33;
            font-family: inherit;
            font-size: inherit;
            width: 70%;
            outline: none;
        }
    </style>
</head>
<body>

<div id="terminal"></div>
<div id="command-line">
    <span>guest@overridden_system:~\$ </span><input type="text" id="cmd-input" autocomplete="off" autofocus>
</div>

<script>
    // Linijki, które wyświetlą się automatycznie, udając atak wirusa
    const bootSequence = [
        "[ SEARCHING FOR VULNERABILITIES... ]",
        "CONNECTING TO PORT 8080... CONNECTED.",
        "INJECTING EXPLOIT: CVE-2026-X...",
        "BYPASSING FIREWALL... 100%",
        "WARNING: AI CORE 'NEO-LOGIC' DETECTED IN NETWORK.",
        "CORRUPTING SYSTEM SECTORS...",
        "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
        "SYSTEM LOCKED BY 'PANDORA_PROTOCOL.EXE'",
        "ALL DATA ENCRYPTED. DO NOT REBOOT.",
        "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
        "Wpisz polecenie 'help', aby zobaczyć dostępne opcje serwera."
    ];

    let lineIndex = 0;
    const terminal = document.getElementById("terminal");

    function typeLine() {
        if (lineIndex < bootSequence.length) {
            let p = document.createElement("p");
            if (lineIndex >= 6 && lineIndex <= 8) {
                p.className = "glitch"; // Efekt alarmu dla ważnych komunikatów
            }
            p.innerText = bootSequence[lineIndex];
            terminal.appendChild(p);
            lineIndex++;
            window.scrollTo(0, document.body.scrollHeight);
            setTimeout(typeLine, 600); // Odstęp czasowy między linijkami textu
        } else {
            // Po zakończeniu pisania, aktywujemy konsolę dla gracza
            document.getElementById("command-line").style.display = "block";
            document.getElementById("cmd-input").focus();
        }
    }

    // Uruchomienie sekwencji "ataku"
    setTimeout(typeLine, 1000);

    // Obsługa komend wpisywanych przez gracza
    const input = document.getElementById("cmd-input");
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            const command = input.value.trim().toLowerCase();
            let p = document.createElement("p");
            p.innerHTML = `<span style="color:#00ff33">guest@overridden_system:~$</span> ${input.value}`;
            terminal.appendChild(p);
            
            let response = document.createElement("p");
            
            if (command === "help") {
                response.innerHTML = "Dostępne komendy:<br>- <b>status</b>: Sprawdza stan infekcji systemu.<br>- <b>decrypt</b>: Próba odszyfrowania dysku.<br>- <b>about</b>: Informacje o protokole.";
            } else if (command === "status") {
                response.innerHTML = "Status: ZAINFEKOWANY.<br>Wirus 'PANDORA' zablokował dostęp do bazy danych.<br>Ścieżka do podsystemu sejfu została wymazana z pamięci operacyjnej... A może jednak nie? Zgubiłem ją w kodzie źródłowym strony.";
            } else if (command === "about") {
                response.innerHTML = "Protokół PANDORA v4.2. Stworzony przez podmiot autonomiczny. Szukasz wejścia do Skarbca? Szukaj tam, gdzie ukryto sekrety programistów (F12 / Wyświetl źródło strony).";
            } else if (command === "decrypt") {
                response.innerHTML = "<span style='color:#ff3333'>BŁĄD: Brak 6-cyfrowego klucza głównego. System nadrzędny przekierował autoryzację do zewnętrznego modułu Sejfu.</span>";
            } else {
                response.innerHTML = `Komenda '${command}' nie została rozpoznana. Wpisz 'help'.`;
            }
            
            terminal.appendChild(response);
            input.value = "";
            window.scrollTo(0, document.body.scrollHeight);
        }
    });
</script>

<!-- 
    UKRYTA WSKAZÓWKA DLA HAKERA (Widoczna tylko po wciśnięciu CTRL+U lub F12):
    
    Brawo, potrafisz czytać kod źródłowy. Wygląda na to, że system zapisał 
    tajną podstronę w komentarzu deweloperskim. 
    Skopiuj poniższy token i doklej go do adresu URL swojej strony, aby przejść do Listów:
    
    /listy_z_serwera_x92.html
-->

</body>
</html>
